<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Games | GameZone</title>
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body data-page="manage-games">
    <header class="site-header">
      <div class="container topbar">
        <a class="brand" href="index.html"><span class="brand-mark">🎮</span><span>GameZone</span></a>
        <nav class="main-nav" aria-label="Main navigation">
          <a href="seller-dashboard.html">Dashboard</a>
          <a href="manage-games.html" class="active">My Games</a>
          <a href="add-game.html">Add New Game</a>
        </nav>
        <div class="header-actions"><a class="btn btn-primary" href="add-game.html">Add Game</a></div>
      </div>
    </header>

    <main class="container page-shell">
      <div class="page-header">
        <h1>Manage Your Games</h1>
        <p>Edit listings, update prices, adjust discounts, and remove titles that no longer fit your catalog.</p>
      </div>
      <div class="panel-block">
        <h3>My listings</h3>
        <div data-seller-games class="order-list"></div>
      </div>

      <div class="panel-block" style="margin-top: 20px;">
        <h3>Quick update</h3>
        <form id="editGameForm" class="form-box">
          <div class="form-grid">
            <div class="form-field"><label for="editName">Game name</label><input class="input" id="editName" name="name" /></div>
            <div class="form-field"><label for="editCategory">Category</label><select class="select" id="editCategory" name="category"><option>Action</option><option>Adventure</option><option>RPG</option><option>Racing</option><option>Simulation</option><option>Strategy</option><option>Horror</option><option>Sports</option><option>Indie</option></select></div>
            <div class="form-field"><label for="editPrice">Price</label><input class="input" id="editPrice" name="price" type="number" step="0.01" /></div>
            <div class="form-field"><label for="editCover">Cover URL</label><input class="input" id="editCover" name="cover" type="url" /></div>
          </div>
          <div class="form-field"><label for="editDescription">Description</label><textarea class="textarea" id="editDescription" name="description" rows="4"></textarea></div>
          <div class="inline-actions"><button class="btn btn-primary" type="submit">Update Game</button></div>
        </form>
      </div>
    </main>

    <footer class="site-footer"><div class="container footer-bottom"><span>© 2026 GameZone</span><span>Seller management</span></div></footer>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
