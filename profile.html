<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile Settings | GameZone</title>
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body data-page="profile">
    <header class="site-header">
      <div class="container topbar">
        <a class="brand" href="index.html"><span class="brand-mark">🎮</span><span>GameZone</span></a>
        <nav class="main-nav" aria-label="Main navigation">
          <a href="index.html">Home</a>
          <a href="games.html">Catalog</a>
          <a href="user-dashboard.html">Dashboard</a>
        </nav>
        <div class="header-actions"><a class="btn btn-primary" href="games.html">Browse</a></div>
      </div>
    </header>

    <main class="container page-shell">
      <div class="page-header">
        <h1>Profile Settings</h1>
        <p>Manage personal details and preferences for your GameZone account.</p>
      </div>
      <div class="panel-block">
        <form id="profileForm" class="form-box">
          <div class="form-grid">
            <div class="form-field"><label for="profileFirstName">First name</label><input class="input" id="profileFirstName" name="firstName" /></div>
            <div class="form-field"><label for="profileLastName">Last name</label><input class="input" id="profileLastName" name="lastName" /></div>
            <div class="form-field"><label for="profileUsername">Username</label><input class="input" id="profileUsername" name="username" /></div>
            <div class="form-field"><label for="profileEmail">Email</label><input class="input" id="profileEmail" name="email" type="email" /></div>
          </div>
          <div class="inline-actions"><button class="btn btn-primary" type="submit">Save Changes</button><button class="btn btn-dark" type="button" data-reset-demo>Reset Demo Data</button></div>
        </form>
      </div>
    </main>

    <footer class="site-footer"><div class="container footer-bottom"><span>© 2026 GameZone</span><span>Profile settings</span></div></footer>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
