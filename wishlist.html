<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wishlist | GameZone</title>
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/games.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body data-page="wishlist">
    <header class="site-header">
      <div class="container topbar">
        <a class="brand" href="index.html"><span class="brand-mark">🎮</span><span>GameZone</span></a>
        <nav class="main-nav" aria-label="Main navigation">
          <a href="index.html">Home</a>
          <a href="games.html">Catalog</a>
          <a href="seller-dashboard.html">Sellers</a>
        </nav>
        <div class="header-actions">
          <a class="icon-pill" href="wishlist.html">♡ <span class="count" data-wishlist-count>0</span></a>
          <a class="icon-pill" href="cart.html">🛒 <span class="count" data-cart-count>0</span></a>
          <a class="btn btn-secondary" href="login.html" data-auth-button>Login</a>
          <a class="btn btn-primary" href="register.html" data-auth-button>Register</a>
          <div class="user-menu-wrap hidden" data-user-menu>
            <button class="btn btn-dark" type="button" data-user-menu-button data-action="toggle-user-menu">Hi, <span data-user-name>Player</span></button>
            <div class="user-menu" data-user-menu-panel>
              <a href="user-dashboard.html">Buyer Dashboard</a>
              <a href="seller-dashboard.html">Seller Dashboard</a>
              <a href="profile.html">Profile</a>
              <button type="button" data-action="logout">Logout</button>
            </div>
          </div>
        </div>
      </div>
    </header>

    <main class="container page-shell">
      <div class="page-header">
        <h1>Wishlist</h1>
        <p>Track your favorite titles and move them to the cart when you're ready.</p>
      </div>
      <div data-wishlist-content></div>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner"><div class="footer-col"><h4>GameZone</h4><p>Your curated library.</p></div></div>
      <div class="container footer-bottom"><span>© 2026 GameZone</span><span>Demo wishlist</span></div>
    </footer>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
