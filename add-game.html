<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add New Game | GameZone</title>
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body data-page="add-game">
    <header class="site-header">
      <div class="container topbar">
        <a class="brand" href="index.html"><span class="brand-mark">🎮</span><span>GameZone</span></a>
        <nav class="main-nav" aria-label="Main navigation">
          <a href="seller-dashboard.html">Dashboard</a>
          <a href="manage-games.html">Manage Games</a>
          <a href="add-game.html" class="active">Add New Game</a>
        </nav>
        <div class="header-actions">
          <a class="btn btn-secondary" href="index.html">Back to Store</a>
        </div>
      </div>
    </header>

    <main class="container page-shell">
      <div class="page-header">
        <h1>Add a New Game</h1>
        <p>Create a new listing with pricing, category, cover art, and availability.</p>
      </div>
      <div class="panel-block">
        <form id="addGameForm" class="form-box">
          <div class="form-grid">
            <div class="form-field"><label for="name">Game name</label><input class="input" id="name" name="name" required /></div>
            <div class="form-field"><label for="category">Category</label><select class="select" id="category" name="category"><option>Action</option><option>Adventure</option><option>RPG</option><option>Racing</option><option>Simulation</option><option>Strategy</option><option>Horror</option><option>Sports</option><option>Indie</option></select></div>
            <div class="form-field"><label for="price">Price</label><input class="input" id="price" name="price" type="number" step="0.01" required /></div>
            <div class="form-field"><label for="oldPrice">Old price</label><input class="input" id="oldPrice" name="oldPrice" type="number" step="0.01" /></div>
            <div class="form-field"><label for="discount">Discount %</label><input class="input" id="discount" name="discount" type="number" value="0" /></div>
            <div class="form-field"><label for="platform">Platform</label><select class="select" id="platform" name="platform"><option>PC</option><option>PlayStation</option><option>Xbox</option><option>Nintendo Switch</option></select></div>
            <div class="form-field"><label for="cover">Cover URL</label><input class="input" id="cover" name="cover" type="url" /></div>
            <div class="form-field"><label for="rating">Rating</label><input class="input" id="rating" name="rating" type="number" min="0" max="5" step="0.1" value="4.5" /></div>
          </div>
          <div class="form-field"><label for="description">Description</label><textarea class="textarea" id="description" name="description" rows="5" required></textarea></div>
          <div class="form-field"><label for="availability">Availability</label><select class="select" id="availability" name="availability"><option>In Stock</option><option>Low Stock</option><option>Pre-order</option></select></div>
          <div class="field-error" data-game-error></div>
          <div class="inline-actions"><button type="submit" class="btn btn-primary">Publish Game</button><a class="btn btn-dark" href="manage-games.html">Back to My Games</a></div>
        </form>
      </div>
    </main>

    <footer class="site-footer"><div class="container footer-bottom"><span>© 2026 GameZone</span><span>Seller tool</span></div></footer>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
