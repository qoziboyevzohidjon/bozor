<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Buyer Dashboard | GameZone</title>
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body data-page="user-dashboard">
    <header class="site-header">
      <div class="container topbar">
        <a class="brand" href="index.html"><span class="brand-mark">🎮</span><span>GameZone</span></a>
        <nav class="main-nav" aria-label="Main navigation">
          <a href="index.html">Home</a>
          <a href="games.html">Catalog</a>
          <a href="wishlist.html">Wishlist</a>
          <a href="orders.html">Orders</a>
        </nav>
        <div class="header-actions">
          <a class="icon-pill" href="wishlist.html">♡ <span class="count" data-wishlist-count>0</span></a>
          <a class="icon-pill" href="cart.html">🛒 <span class="count" data-cart-count>0</span></a>
          <div class="user-menu-wrap" data-user-menu>
            <button class="btn btn-dark" type="button" data-user-menu-button data-action="toggle-user-menu">Hi, <span data-user-name>Player</span></button>
            <div class="user-menu" data-user-menu-panel>
              <a href="user-dashboard.html">Buyer Dashboard</a>
              <a href="seller-dashboard.html">Seller Dashboard</a>
              <a href="profile.html">Profile</a>
              <button type="button" data-action="logout">Logout</button>
            </div>
          </div>
        </div>
      </div>
    </header>

    <main class="container page-shell">
      <div class="dashboard-layout">
        <aside class="side-panel">
          <div class="side-panel-header">
            <div class="user-chip">
              <img class="avatar" src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=400&q=80" alt="User avatar" />
              <div>
                <strong data-user-name>Player</strong>
                <p class="inline-note">Buyer account</p>
              </div>
            </div>
          </div>
          <nav class="side-nav" aria-label="Buyer menu">
            <a href="user-dashboard.html" class="active">Overview</a>
            <a href="orders.html">My Orders</a>
            <a href="wishlist.html">Wishlist</a>
            <a href="cart.html">Cart</a>
            <a href="profile.html">Profile Settings</a>
            <button type="button" data-action="logout">Logout</button>
          </nav>
        </aside>
        <section class="main-panel" data-dashboard-root></section>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner"><div class="footer-col"><h4>GameZone</h4><p>Buyer focused dashboard.</p></div></div>
      <div class="container footer-bottom"><span>© 2026 GameZone</span><span>Buyer profile</span></div>
    </footer>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
